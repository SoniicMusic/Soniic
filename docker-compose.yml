services:
  soniic:
    image: ghcr.io/soniicmusic/soniic:main
    env_file:
      - ./.env
    volumes:
      - ./keys:/app/keys
    deploy:
      update_config:
        order: start-first
    depends_on:
      - db
  db:
    image: postgres:17.5
    env_file:
      - ./.env
    volumes:
      - ./db:/var/lib/postgresql/data